{% extends "base.html" %}

{% block content %}
<section class="hero">
    <p class="eyebrow" id="today-label"></p>
    <h1 class="hero-title">Only For Me<span class="accent">.</span></h1>
    <p class="hero-desc">컴공 23 박내훈 | devsign project</p>
</section>

<!-- ===== 캘린더 ===== -->
<section class="panel">
    <div class="panel-head">
        <h2 class="panel-title" id="month-year"></h2>
        <div class="calendar-nav">
            <button type="button" class="icon-btn" id="prev-month" aria-label="이전 달">&lsaquo;</button>
            <button type="button" class="btn btn-ghost btn-sm" id="today-btn">오늘</button>
            <button type="button" class="icon-btn" id="next-month" aria-label="다음 달">&rsaquo;</button>
        </div>
    </div>
    <div class="calendar-weekdays">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
    </div>
    <div class="calendar-grid" id="calendar-days"></div>
</section>

<!-- ===== 카테고리 카드 (목록은 categories.py 에서 관리) ===== -->
<section>
    <h2 class="section-title">공부 기록</h2>
    <div class="category-grid">
        {% for cat in categories %}
        <a class="category-card" href="{{ url_for('category', slug=cat.slug) }}">
            <span class="category-icon">{{ cat.icon }}</span>
            <span class="category-body">
                <span class="category-title">{{ cat.title }}</span>
                {% if cat.description %}<span class="category-desc">{{ cat.description }}</span>{% endif %}
            </span>
            <span class="category-arrow" aria-hidden="true">&rarr;</span>
        </a>
        {% endfor %}
    </div>
</section>

<!-- ===== 일정 입력 팝업 ===== -->
<dialog id="memo-dialog" class="dialog">
    <div class="dialog-body">
        <h3 id="memo-dialog-title" class="dialog-title">일정</h3>
        <textarea id="memo-input" class="input textarea" placeholder="여기에 일정을 적어주세요..."></textarea>
        <div class="dialog-actions">
            <button type="button" id="delete-memo-btn" class="btn btn-danger owner-only push-left">삭제</button>
            <button type="button" class="btn btn-secondary" data-close>닫기</button>
            <button type="button" id="save-memo-btn" class="btn btn-primary owner-only">저장</button>
        </div>
    </div>
</dialog>
{% endblock %}
