# Render 배포 설정 (Render 를 쓸 때만 필요한 파일 — 다른 곳에 배포하면 무시됨)
#   Render 대시보드 → New → Blueprint → 이 저장소 선택하면 이 파일대로 서버가 만들어집니다.
#   Dockerfile 로 빌드하므로 Cloud Run·가상 서버와 완전히 같은 환경으로 실행됩니다.
#   sync: false 인 값들은 만들 때 Render 화면에서 직접 입력합니다. (비밀 값이라 파일에 적지 않음)
services:
  - type: web
    name: my-study-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore          # 한국에서 가장 가까운 지역
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SPOTIPY_CLIENT_ID
        sync: false
      - key: SPOTIPY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REFRESH_TOKEN   # scripts/spotify_refresh_token.py 로 확인
        sync: false
