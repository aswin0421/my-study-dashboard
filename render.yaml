# Render 배포 설정 (Blueprint)
#   Render 대시보드 → New → Blueprint → 이 저장소 선택하면 이 파일대로 서버가 만들어집니다.
#   sync: false 인 값들은 만들 때 Render 화면에서 직접 입력합니다. (비밀 값이라 파일에 적지 않음)
#   main 브랜치에 push 할 때마다 자동으로 다시 배포됩니다.
services:
  - type: web
    name: my-study-dashboard
    runtime: python
    plan: free
    region: singapore          # 한국에서 가장 가까운 지역
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SPOTIPY_CLIENT_ID
        sync: false
      - key: SPOTIPY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REFRESH_TOKEN   # scripts/spotify_refresh_token.py 로 확인
        sync: false
