# 매일 아침 7시(KST) 오늘의 캘린더 일정을 디스코드로 보내기
#   - 스크립트: scripts/notify_today.py
#   - 필요한 Secrets (저장소 Settings → Secrets and variables → Actions):
#       SUPABASE_URL, SUPABASE_KEY, DISCORD_WEBHOOK_URL
#   - 테스트: Actions 탭 → daily-calendar-notify → Run workflow (기다리지 않고 바로 전송)
name: daily-calendar-notify

on:
  schedule:
    # cron 은 UTC 기준. 21:40 UTC = 한국시간 06:40
    # → 스크립트가 7시 정각까지 기다렸다가 전송 (GitHub 예약 실행이 늦게 시작되는 것 대비)
    - cron: "40 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 오늘 일정 디스코드로 보내기
        run: python scripts/notify_today.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WAIT_UNTIL_SEND_TIME: ${{ github.event_name == 'schedule' }}
