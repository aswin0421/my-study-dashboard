# 매일 아침 7시(KST) 오늘의 캘린더 일정을 디스코드로 보내기
#   - 스크립트: scripts/notify_today.py
#   - 실행: cron-job.org 가 매일 06:55(KST)에 GitHub API 로 이 워크플로를 실행 (wait_until_send_time=true)
#     → 스크립트가 7시 정각까지 기다렸다가 전송
#     (GitHub 자체 예약 실행(schedule)은 몇 시간씩 늦게 시작돼서 쓰지 않음 — 06:40 예약이 10시에 시작된 적 있음)
#   - 필요한 Secrets (저장소 Settings → Secrets and variables → Actions):
#       SUPABASE_URL, SUPABASE_KEY, DISCORD_WEBHOOK_URL
#   - 테스트: Actions 탭 → daily-calendar-notify → Run workflow (기다리지 않고 바로 전송)
name: daily-calendar-notify

on:
  workflow_dispatch:
    inputs:
      wait_until_send_time:
        description: "7시 정각까지 기다렸다가 전송 (cron-job.org 예약 실행용)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 오늘 일정 디스코드로 보내기
        run: python scripts/notify_today.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WAIT_UNTIL_SEND_TIME: ${{ inputs.wait_until_send_time }}
