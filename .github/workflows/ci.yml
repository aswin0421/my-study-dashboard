# push 할 때마다 자동 검사 (Actions 탭에서 결과 확인)
#   1) test   : 파이썬 테스트 (tests/ 폴더, pytest)
#   2) docker : Docker 이미지를 실제로 빌드하고 실행해서 /healthz 와 메인 페이지 응답 확인
#              → 통과하면 Render·Cloud Run·가상 서버 어디에 올려도 같은 이미지로 실행 가능
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 패키지 설치
        run: pip install -r requirements-dev.txt

      - name: 테스트
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Docker 이미지 빌드
        run: docker build -t my-study-dashboard .

      - name: 컨테이너 실행 후 헬스체크
        run: |
          docker run -d --name app -p 8000:8000 my-study-dashboard
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz; then
              echo ""
              echo "헬스체크 통과"
              exit 0
            fi
            sleep 1
          done
          echo "헬스체크 실패 — 컨테이너 로그:"
          docker logs app
          exit 1

      - name: 메인 페이지 응답 확인
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
          echo "메인 페이지 응답: $code"
          test "$code" = "200"

      - name: 컨테이너 로그
        if: always()
        run: docker logs app || true
